<div class="font1" *ngIf="trader">
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-4 text-center">
      <div class="mb-3">
        <img [src]="trader.image || 'https://placehold.co/180x180/e2e8f0/64748b?text=Merchant'"
             alt="{{ trader.businessName }}" 
             class="rounded-circle shadow-sm trader-avatar"
             style="width: 140px; height: 140px; object-fit: cover;">
      </div>

      <h3 class="fw-bold mb-1 text-dark">{{ trader.businessName }}</h3>
      <p class="text-muted mb-3"><i class="bi bi-person-fill"></i> {{ trader.fname }}</p>

      <div class="row g-2 text-start my-3">
        <div class="col-12" *ngIf="trader.email">
          <div class="p-2 rounded-3 bg-light border d-flex align-items-center">
            <i class="bi bi-envelope text-success me-2 fs-5"></i>
            <div>
              <small class="text-muted d-block lh-1">Email</small>
              <span class="small fw-semibold">{{ trader.email }}</span>
            </div>
          </div>
        </div>

        <div class="col-12" *ngIf="trader.cell">
          <div class="p-2 rounded-3 bg-light border d-flex align-items-center">
            <i class="bi bi-telephone text-success me-2 fs-5"></i>
            <div>
              <small class="text-muted d-block lh-1">Phone</small>
              <span class="small fw-semibold">{{ trader.cell }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4" *ngIf="trader.cell">
        <a [href]="getWhatsAppUrl()" target="_blank" class="btn btn-whatsapp w-100 py-2">
          <i class="bi bi-whatsapp fs-5"></i> Chat on WhatsApp
        </a>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!trader" class="text-center py-4">
  <div class="spinner-border text-success" role="status">
    <span class="visually-hidden">Loading trader details...</span>
  </div>
</div>
